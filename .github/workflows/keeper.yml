name: Draw Keeper

on:
  workflow_dispatch: {}

concurrency:
  group: draw-keeper
  cancel-in-progress: false

jobs:
  run-keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

    
      - run: timeout 260 npm run keeper:watch || true
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          CAIRN_CONTRACT_ADDRESS: ${{ secrets.CAIRN_CONTRACT_ADDRESS }}