name: Draw Keeper

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum interval)
  workflow_dispatch: {}       # lets you trigger it manually anytime, e.g. right before recording your demo video

jobs:
  run-keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # A single `npm run keeper` pass only does ONE of the three sequential
      # draw steps (start -> submit-weight-and-draw-winner -> submit-winner).
      # On a plain 5-minute cron, a full draw could take up to ~15 minutes
      # wall-clock to fully resolve (three separate 5-minute-apart ticks) —
      # which looks exactly like "the keeper isn't working" if you're
      # watching live. Running keeper:watch (15s poll) for most of this
      # job's window instead means a full draw resolves in well under a
      # minute once eligible, not up to 15. `timeout` (not the script itself)
      # bounds it so the job exits cleanly before GitHub's own 5-minute
      # per-job ceiling, rather than being hard-killed mid-transaction.
      - run: timeout 260 npm run keeper:watch || true
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          CAIRN_CONTRACT_ADDRESS: ${{ secrets.CAIRN_CONTRACT_ADDRESS }}
